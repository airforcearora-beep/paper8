<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NISM VIII – Quick Revision Sheet</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7f9;--card:#fff;--tx:#1b2430;--mu:#5d6b7c;--bd:#d9dee5;--ac:#2456c5;--fb:#eef3ff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12161c;--card:#1b222b;--tx:#e8edf3;--mu:#97a3b2;--bd:#2d3846;--ac:#7aa2f5;--fb:#1f2a3d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 14px}
.in{max-width:1000px;margin:auto}
h1{font-size:1.05rem;margin:0 0 8px}
input{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
nav{display:flex;gap:6px;overflow-x:auto;padding-top:8px}
nav a{flex:none;text-decoration:none;color:var(--ac);border:1px solid var(--bd);border-radius:14px;padding:2px 10px;font-size:.85rem}
main{max-width:1000px;margin:auto;padding:14px}
section{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;margin-bottom:16px;scroll-margin-top:110px}
h2{font-size:1.05rem;margin:0 0 10px;color:var(--ac)}
h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mu);margin:12px 0 6px}
ul{list-style:none;margin:0;padding:0}
li{padding:5px 0;border-bottom:1px dashed var(--bd)}
li:last-child{border:0}
li b{font-weight:600}
li.f{background:var(--fb);border-radius:8px;border:0;margin:5px 0;padding:6px 10px}
.f code{display:block;font:600 .92rem ui-monospace,Menlo,Consolas,monospace;overflow-x:auto}
.f i{color:var(--mu);font-size:.85rem;font-style:normal}
.hide{display:none}
</style></head><body>
<header><div class="in"><h1>NISM VIII · Quick Revision Sheet</h1><input id="q" placeholder="Search…" type="search"><nav id="nav"></nav></div></header>
<main id="m"></main>
<script>

const m=document.getElementById("m"),nav=document.getElementById("nav");
C.forEach((c,i)=>{const s=document.createElement("section");s.id="c"+(i+1);
s.innerHTML=`<h2>${c[0]}</h2><h3>Key points</h3><ul>${c[1].map(p=>`<li><b>${p[0]}</b> — ${p[1]}</li>`).join("")}</ul>`+(c[2].length?`<h3>Formulas</h3><ul>${c[2].map(f=>`<li class="f"><code>${f[0]}</code><i>${f[1]}</i></li>`).join("")}</ul>`:"");

document.getElementById("q").oninput=e=>{const v=e.target.value.toLowerCase();
document.querySelectorAll("li").forEach(l=>l.classList.toggle("hide",!!v&&!l.textContent.toLowerCase().includes(v)));

</script></body></html>
