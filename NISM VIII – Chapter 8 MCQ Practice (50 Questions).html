<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NISM VIII – Chapter 8 MCQ Practice</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7f9;--card:#fff;--tx:#1b2430;--mu:#5d6b7c;--bd:#d9dee5;--ac:#2456c5;--ok:#e3f5e9;--okb:#1f9d55;--no:#fde8e8;--nob:#d23a3a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12161c;--card:#1b222b;--tx:#e8edf3;--mu:#97a3b2;--bd:#2d3846;--ac:#6b97ee;--ok:#16301f;--okb:#3ec275;--no:#3a1c1c;--nob:#ef6b6b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--card);border-bottom:1px solid var(--bd);padding:10px 16px;z-index:5}
header .in{max-width:760px;margin:auto;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:1.05rem;margin:0}
.st{color:var(--mu);font-size:.9rem}
.bar{height:4px;background:var(--bd);margin-top:8px;border-radius:2px;max-width:760px;margin-inline:auto}
.bar i{display:block;height:100%;width:0;background:var(--ac);border-radius:2px;transition:width .2s}
main{max-width:760px;margin:auto;padding:16px}
.q{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
.q h3{font-size:1rem;margin:0 0 10px;font-weight:600}
.q h3 span{color:var(--mu);margin-right:6px}
.o{display:block;width:100%;text-align:left;background:transparent;color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;margin-top:8px;font:inherit;cursor:pointer}
.o:hover:not(:disabled){border-color:var(--ac)}
.o:disabled{cursor:default}
.o.c{background:var(--ok);border-color:var(--okb)}
.o.w{background:var(--no);border-color:var(--nob)}
.fb{margin-top:10px;font-size:.92rem;display:none}
.fb.s{display:block}
.fb b.c{color:var(--okb)}.fb b.w{color:var(--nob)}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:12px 22px;font:inherit;font-weight:600;cursor:pointer}
.btn.g{background:transparent;color:var(--ac);border:1px solid var(--ac)}
#res{display:none;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:20px;text-align:center}
#res .big{font-size:2.2rem;font-weight:700}
#res table{margin:12px auto;border-collapse:collapse}
#res td{padding:4px 14px;border-bottom:1px solid var(--bd);text-align:left}
.pass{color:var(--okb)}.fail{color:var(--nob)}
</style></head><body>
<header><div class="in"><h1>NISM VIII · Chapter 8: Legal &amp; Regulatory Environment (50 Questions)</h1><div class="st" id="st"></div></div><div class="bar"><i id="pb"></i></div></header>
<main><div id="qs"></div>
<div style="text-align:center;margin:20px 0"><button class="btn" id="fin">Finish &amp; see result</button></div>
<div id="res"></div></main>
<script>
// [question, [options], correctIndex, explanation]  — append more rows here to extend the paper
const Q=[
["Derivatives trading in India is governed by the SCRA 1956, the ________, and related rules and bye-laws.", ["SEBI Act, 1992", "Banking Regulation Act", "Income Tax Act", "Companies Act only"], 0, "Along with regulations framed under them."],
["The SCRA, 1956 aims to ________.", ["Fix prices", "Tax securities", "Prevent undesirable transactions in securities", "Regulate banks"], 2, "It governs securities trading in India."],
["‘Securities’ is defined in Section ________ of SCRA.", ["18A", "4", "31", "2(h)"], 3, "Section 2(h)."],
["As per SCRA, ‘securities’ include ________.", ["Only bonds", "Derivatives", "Only mutual funds", "Only shares"], 1, "Derivatives, shares, bonds, government securities and more."],
["‘Securities’ under SCRA do NOT include ________.", ["Unit linked insurance policies", "Mutual fund units", "Government securities", "Debentures"], 0, "ULIPs are excluded."],
["SCRA defines a derivative as a security derived from ________.", ["Only currency", "A debt instrument, share, loan, risk instrument or contract for differences", "Only gold", "Only index"], 1, "Or a contract deriving value from prices of underlying securities."],
["SCRA’s definition of derivatives includes ________.", ["Only forex", "Only equity", "Commodity derivatives", "Only options"], 2, "Also instruments declared by the Central Government."],
["A derivative contract under SCRA derives its value from ________.", ["Weather", "Dividends", "Prices or index of prices of underlying securities", "Interest only"], 2, "As defined in the Act."],
["Section 18A makes derivative contracts legal and valid if ________.", ["Traded on a recognised stock exchange and settled on its clearing house", "Signed by SEBI", "Agreed privately", "Settled in cash only"], 0, "Per rules and bye-laws."],
["The SEBI Act, 1992 provides for ________.", ["Taxation", "Establishing RBI", "Forming exchanges", "Establishing SEBI with statutory powers"], 3, "To protect investors, develop and regulate the securities market."],
["SEBI’s three statutory objectives are protecting investors, promoting development of and ________ the securities market.", ["Closing", "Taxing", "Funding", "Regulating"], 3, "Per the SEBI Act."],
["SEBI has powers to ________.", ["Print money", "Set interest rates", "Register brokers and prohibit fraudulent and unfair practices", "Appoint judges"], 2, "Also inspect and inquire."],
["SEBI promotes and regulates ________.", ["Banks", "Courts", "Self-regulatory organisations", "Insurers"], 2, "One of its powers."],
["SEBI (Prevention of Insider Trading) Regulations were issued in ________.", ["1992", "2015", "2002", "2008"], 1, "PMLA was enacted in 2002."],
["The Prevention of Money Laundering Act was enacted in ________.", ["2011", "2002", "1956", "2015"], 1, "Important for securities market intermediaries."],
["SEBI SAST Regulations relate to ________.", ["Depositories", "Custodians", "Stock brokers", "Substantial acquisition of shares and takeovers"], 3, "Issued in 2011."],
["SECC Regulations, 2018 govern ________.", ["Stock exchanges and clearing corporations", "Banks", "Mutual funds", "Brokers only"], 0, "Securities Contracts (Regulation) (Stock Exchanges and Clearing Corporations)."],
["Stock brokers are governed by the SEBI (Stock Brokers) Regulations, ________.", ["2026", "2008", "1992", "1956"], 0, "Erstwhile 1992 regulations."],
["SEBI accepted the L. C. Gupta Committee recommendations on ________.", ["Nov 18, 1996", "March 17, 1998", "May 11, 1998", "June 2000"], 2, "Phased introduction began with stock index futures."],
["Derivatives trading in India began in phases starting with ________.", ["Stock futures", "Stock options", "Index options", "Stock index futures"], 3, "As approved in 1998."],
["An exchange seeks recognition to trade derivatives under Section ________ of SCRA.", ["4", "18A", "31", "2(h)"], 0, "Recognition under Section 4."],
["On the derivatives exchange’s governing council, representation of trading or clearing members is limited to ________.", ["60%", "40%", "100%", "10%"], 1, "The council must be separate."],
["A derivatives exchange should have a minimum of ________ members.", ["50", "10", "25", "100"], 0, "As per the L. C. Gupta Committee."],
["Members of an existing cash segment ________ become derivative segment members.", ["Automatically", "Only if banks", "Never", "Do not automatically"], 3, "They must meet eligibility conditions."],
["Clearing and settlement of derivatives trades is through a ________.", ["Broker", "Depository", "SEBI approved clearing corporation", "Bank"], 2, "Per the committee."],
["The committee’s minimum net worth for clearing members was ________.", ["Rs 1 crore", "Rs 300 lakh", "Rs 50 lakh", "Rs 15 crore"], 1, "The current SEBI requirement is different."],
["Net worth is computed as capital plus free reserves less ________.", ["Salaries", "Dividends", "Non-allowable assets", "Taxes"], 2, "E.g., fixed assets, pledged securities, doubtful debts."],
["Members must give clients a ________ and obtain a signed copy.", ["Risk Disclosure Document", "Licence", "Contract note", "Annual report"], 0, "Along with strict KYC."],
["Trading members must have approved users and sales personnel who ________.", ["Are bank staff", "Are SEBI officials", "Passed an approved certification programme", "Hold any degree"], 2, "This exam provides that certification."],
["The J. R. Varma Committee (June 1998) recommended measures for ________.", ["Taxation", "Listing", "Brokerage", "Risk containment"], 3, "Including initial margin, position limits and net worth."],
["The derivative segment’s membership and bye-laws are ________ from the cash segment.", ["Merged", "Optional", "Separate", "Same"], 2, "As per SEBI’s framework."],
["A stock broker is issued ________ certificate of registration by SEBI.", ["One per segment", "One per exchange", "Two", "One, irrespective of exchanges and segments"], 3, "Subject to exchange approval for each."],
["A registered stock broker acting as clearing member needs ________ registration.", ["Annual", "A new", "No separate", "Two"], 2, "Subject to clearing corporation approval."],
["Admission as a trading member considers ________.", ["Only age", "Only education", "Age, capital adequacy, track record, education, experience and fit and proper", "Only capital"], 2, "Under the Intermediaries Regulations."],
["Fit and proper criteria include ________.", ["Integrity, absence of convictions, competence and not being a wilful defaulter", "Only age", "Only wealth", "Only experience"], 0, "Per Schedule II, SEBI (Intermediaries) Regulations, 2008."],
["Base net worth of an ‘only trading member’ is ________.", ["Rs 5 crore", "Rs 50 crore", "Rs 15 crore", "Rs 1 crore"], 3, "Net worth is the higher of base and variable."],
["Base net worth of a self-clearing member is ________.", ["Rs 1 crore", "Rs 5 crore", "Rs 50 crore", "Rs 15 crore"], 1, "Per SEBI Stock Broker Regulations 2026."],
["Base net worth of a clearing member is ________.", ["Rs 1 crore", "Rs 5 crore", "Rs 50 crore", "Rs 15 crore"], 3, "For equity derivatives."],
["Base net worth of a professional clearing member is ________.", ["Rs 15 crore", "Rs 1 crore", "Rs 50 crore", "Rs 5 crore"], 2, "The highest category."],
["Variable net worth is ________ of average daily client cash balance.", ["25%", "10%", "50%", "1%"], 1, "Over the previous six months."],
["Every clearing member must maintain liquid net worth of at least ________.", ["Rs 1 crore", "Rs 5 crore", "Rs 50 lakh", "Rs 10 lakh"], 2, "With the exchange or clearing corporation."],
["NSE Clearing requires a deposit of ________ per trading member cleared.", ["Rs 5 lakh", "Rs 10 lakh", "Rs 1 lakh", "Rs 50 lakh"], 1, "In addition to other deposits."],
["A broker’s registration can be penalised or suspended for ________.", ["Any of: violating the Act, code of conduct, failing to pay fees, being suspended by the exchange", "None of these", "Only tax default", "Only fees"], 0, "All listed grounds apply."],
["On default, the TM makes good clients’ default to the ________.", ["Clearing member", "Depository", "SEBI", "Exchange"], 0, "The CM makes good to the clearing corporation."],
["A TM’s default ________ lead to the CM’s default.", ["Only for PCM", "Always", "Need not necessarily", "Never"], 2, "If the CM continues to meet obligations."],
["On a broker default, the exchange ________.", ["Pays from tax", "Closes the exchange", "Issues a public notice inviting claims", "Ignores it"], 2, "And informs clients by email and SMS."],
["Investor claims against a defaulter broker are compensated from the ________.", ["RBI", "Brokers’ profits", "Investor Protection Fund", "Core SGF"], 2, "Eligibility norms are on the exchange website."],
["During an exchange outage, trading ________.", ["Moves to OTC", "Continues in unaffected segments and other exchanges", "Stops everywhere", "Is cancelled"], 1, "The affected exchange activates its DR site."],
["The exchange informs participants ________ before resuming trading after an outage.", ["1 hour", "5 minutes", "1 day", "At least 15 minutes"], 3, "A pre-open session precedes resumption."],
["If trading does not normalise 1 hour before closing, all exchanges extend trading hours by ________.", ["3 hours", "One and a half hours", "30 minutes", "None"], 1, "The affected exchange intimates participants and SEBI."]
];
const ans=new Array(Q.length).fill(null),qs=document.getElementById("qs"),L="abcd";
Q.forEach((q,i)=>{const d=document.createElement("div");d.className="q";
d.innerHTML=`<h3><span>Q${i+1}.</span>${q[0]}</h3>`+q[1].map((o,j)=>`<button class="o" data-j="${j}"><b>(${L[j]})</b> ${o}</button>`).join("")+`<div class="fb"></div>`;
d.querySelectorAll(".o").forEach(b=>b.onclick=()=>pick(i,+b.dataset.j,d));qs.appendChild(d)});
function upd(){const n=ans.filter(a=>a!==null).length;document.getElementById("st").textContent=`Answered ${n}/${Q.length}`;document.getElementById("pb").style.width=n/Q.length*100+"%"}
function pick(i,j,d){if(ans[i]!==null)return;ans[i]=j;const k=Q[i][2],bs=d.querySelectorAll(".o");
bs.forEach((b,x)=>{b.disabled=true;if(x===k)b.classList.add("c");else if(x===j)b.classList.add("w")});
const f=d.querySelector(".fb");f.classList.add("s");
f.innerHTML=(j===k?`<b class="c">✓ Correct.</b> `:`<b class="w">✗ Wrong.</b> Correct answer: (${L[k]}). `)+Q[i][3];upd()}
document.getElementById("fin").onclick=()=>{const un=ans.filter(a=>a===null).length;
if(un&&!confirm(un+" question(s) unanswered. Finish anyway?"))return;
let c=0,w=0;ans.forEach((a,i)=>{if(a===null)return;a===Q[i][2]?c++:w++});
const sc=c-0.25*w,pct=sc/Q.length*100,ok=pct>=60,r=document.getElementById("res");
r.style.display="block";r.innerHTML=`<h2>Result</h2><div class="big ${ok?"pass":"fail"}">${sc.toFixed(2)} / ${Q.length}</div><div>${pct.toFixed(1)}% · <b class="${ok?"pass":"fail"}">${ok?"PASS":"BELOW PASS MARK"}</b> (pass mark 60%)</div>
<table><tr><td>Correct</td><td>${c}</td></tr><tr><td>Wrong (−0.25 each)</td><td>${w}</td></tr><tr><td>Unanswered</td><td>${un}</td></tr></table>
<button class="btn g" onclick="location.reload()">Retake</button>`;r.scrollIntoView({behavior:"smooth"})};
upd();
</script></body></html>
